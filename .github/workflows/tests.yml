name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - SQLite - ${{ matrix.dependencies }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        dependencies: [lowest, highest]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/pest --ci

  mysql:
    name: PHP 8.5 - Laravel ${{ matrix.laravel }} - MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-26.04

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: interlock
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
        mysql: ['8.4', '9.7']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: interlock
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: vendor/bin/pest --ci

  pgsql:
    name: PHP 8.5 - Laravel ${{ matrix.laravel }} - PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: interlock
          POSTGRES_PASSWORD: password
          POSTGRES_DB: interlock
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U interlock" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
        postgres: ['17', '18']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: interlock
      DB_USERNAME: interlock
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none

      - run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: vendor/bin/pest --ci
