name: Static analysis

# On main these run from the release workflow, which releases only once they pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A fixed name: called from another workflow, github.workflow is the caller's name, which both called workflows share.
concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: vendor/bin/pint --test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: vendor/bin/phpstan analyse --no-progress --error-format=github
